[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade Agentic RAG system with multi-turn chat, file ingestion, hybrid retrieval and observability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "tai.pham" }]

dependencies = [
    # ---- web framework ----
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.20",        # form/file upload
    "sse-starlette>=2.1.3",            # SSE helper
    "httpx>=0.28.1",

    # ---- data validation / settings ----
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "orjson>=3.10.12",

    # ---- DB ----
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",           # cho langgraph postgres checkpointer (sync)

    # ---- redis / queue / cache ----
    "redis>=5.2.1",
    "arq>=0.26.3",

    # ---- vector / object storage ----
    "qdrant-client>=1.12.1",
    "minio>=7.2.10",

    # ---- LLM / agent ----
    "openai>=1.57.4",                   # gọi Gemini qua OpenAI-compat
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.7",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "cohere>=5.13.0",                   # rerank API (rerank-v3.5, multilingual)

    # ---- ingestion ----
    "pymupdf>=1.25.1",                  # parse PDF nhanh, đủ tốt cho legal doc text-only
    "pypdf>=5.1.0",                     # fallback parser
    "python-magic>=0.4.27",             # detect mime
    "langchain-text-splitters>=0.3.4",  # fallback chunker

    # ---- observability ----
    "langfuse>=2.59.0",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # ---- auth ----
    "pyjwt[crypto]>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",

    # ---- misc ----
    "python-slugify>=8.0.4",
    "ulid-py>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "testcontainers[postgres,redis]>=4.9.0",
]

[tool.uv]
# uv config

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "T20"]
ignore = ["S101", "B008"]  # S101: assert OK trong tests; B008: FastAPI Depends ở default arg

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"src/scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/db/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# Mặc định chỉ chạy unit test (hermetic, mock hết IO). Bỏ qua test cần infra/mạng.
# Chạy live/integration: pytest -m live   |   pytest -m integration
addopts = ["-q", "--strict-markers", "-m", "not live and not integration"]
markers = [
    "live: gọi API thật (Cohere/Gemini) — cần key + mạng",
    "integration: cần hạ tầng thật (postgres/redis/qdrant/minio)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
