# Top-level nginx config. Lưu ý SSE: tắt buffer và keep-alive cao.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75s;
    server_tokens off;

    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"rt":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_rt":"$upstream_response_time"'
      '}';
    access_log /var/log/nginx/access.log json_combined;

    # Body size đủ cho upload nhiều file
    client_max_body_size 200m;
    client_body_buffer_size 1m;

    # Gzip cho JSON response, KHÔNG gzip cho SSE (sẽ bị buffer)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    # Upstream API replicas — Docker DNS resolve ra nhiều IP
    # `resolver` cần để Nginx re-resolve khi container restart
    upstream api_upstream {
        # least_conn phù hợp khi request có latency khác nhau (chat streaming)
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
