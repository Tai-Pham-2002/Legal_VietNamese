name: CI

# Validate every pull request and every push to main.
# Fast feedback first (lint + unit), heavier jobs (integration, docker, security)
# run in parallel so the slowest job sets total wall-clock — not the sum.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more escalate locally.
permissions:
  contents: read

# A new push to the same PR/branch cancels the in-flight run (PRs only —
# never cancel a main-branch run, which CD may depend on).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.7"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps (locked)
        run: uv sync --frozen --dev
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check --output-format=github src tests
      - name: Mypy (strict)
        run: uv run mypy src

  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps (locked)
        run: uv sync --frozen --dev
      # pyproject addopts already filters `-m "not live and not integration"`,
      # so this runs only the mocked, network-free unit suite.
      - name: Pytest
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests (real infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps (locked)
        run: uv sync --frozen --dev

      # Reuse the project's own compose definitions for infra instead of
      # re-declaring service containers — single source of truth.
      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          ENV=test
          LOG_LEVEL=WARNING
          SECRET_KEY=ci-secret-key-must-be-at-least-32-bytes-long-xxxxxxxx
          LLM_API_KEY=ci-fake-llm-key
          RERANK_PROVIDER=cohere
          COHERE_API_KEY=ci-fake-cohere-key
          LANGFUSE_ENABLED=false
          # Postgres — compose uses these; pytest connects via POSTGRES_DSN below.
          POSTGRES_DB=rag
          POSTGRES_USER=rag
          POSTGRES_PASSWORD=rag
          POSTGRES_DSN=postgresql+asyncpg://rag:rag@localhost:5432/rag
          REDIS_URL=redis://localhost:6379/0
          # Qdrant — must be non-empty or Qdrant enables auth with an empty key (401).
          QDRANT_URL=http://localhost:6333
          QDRANT_API_KEY=ci-qdrant-key
          # MinIO — root creds must equal the access/secret the app reads.
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_ENDPOINT=localhost:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET=rag-files
          EOF

      - name: Start infra
        run: docker compose up -d --wait postgres redis qdrant minio
      - name: Create MinIO bucket
        run: docker compose run --rm minio-init || true
      - name: Run DB migrations
        run: uv run python -m src.scripts.migrate

      - name: Pytest (integration)
        run: |
          set +e
          uv run pytest -m integration
          code=$?
          # Exit 5 == "no tests collected"; the integration suite may still be
          # a placeholder. Treat that as a pass so the gate is green-by-default.
          if [ "$code" -eq 5 ]; then
            echo "::notice::No integration tests collected — treating as pass."
            exit 0
          fi
          exit "$code"

      - name: Dump infra logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build & image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build the same runtime target the stack ships, loading it locally so we
      # can scan the exact artifact. uv.lock means `--frozen` in the Dockerfile
      # resolves deterministically.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: legal-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (report HIGH/CRITICAL → SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: legal-rag:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Hard gate: fail the build only on CRITICAL, fixable vulns.
      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: legal-rag:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Audit the exact locked runtime deps (not dev) against the PyPI advisory DB.
      - name: pip-audit (locked dependencies)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.lock.txt
          uvx pip-audit --requirement requirements.lock.txt --strict

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
